name: english-desk
services:
  english-desk:
    image: ${ENGLISH_DESK_IMAGE:-english-desk:local}
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ENGLISH_DESK_PORT:-8081}:8081"
    environment:
      ENGLISH_DESK_PUBLIC_ORIGINS: "http://127.0.0.1:${ENGLISH_DESK_PORT:-8081},http://localhost:${ENGLISH_DESK_PORT:-8081}"
    volumes:
      - notebook-data:/app/data
      - translation-runtime:/app/.runtime
      - translation-python:/app/.venv
    stop_grace_period: 30s
volumes:
  notebook-data:
  translation-runtime:
  translation-python:
