name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified version as a downloadable Linux amd64 image
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Read application version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "$(node -p "require('./app.json').expo.version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: docker build --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" --tag english-desk:docker --tag "english-desk:$VERSION" .
      - name: Verify container APIs and persistent volumes
        run: npm run test:docker -- --image english-desk:docker
      - name: Decide whether this version needs a release
        id: release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="docker-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its image unchanged. Bump the application version for a new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Export verified image and checksum
        if: steps.release.outputs.publish == 'true'
        run: |
          docker save english-desk:docker | gzip > english-desk-linux-amd64.tar.gz
          sha256sum english-desk-linux-amd64.tar.gz > SHA256SUMS
      - name: Publish Docker download
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$RELEASE_TAG" english-desk-linux-amd64.tar.gz SHA256SUMS --target "$GITHUB_SHA" --title "English Desk $VERSION · Docker" --notes-file docs/docker-release-notes.md
