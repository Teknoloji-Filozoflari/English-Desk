name: Docker
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified linux/amd64 image as a downloadable GitHub release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag english-desk:docker .
      - name: Verify container APIs and persistent volumes
        run: npm run test:docker -- --image english-desk:docker
      - name: Export verified image
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: docker save english-desk:docker | gzip > english-desk-linux-amd64.tar.gz
      - name: Publish Docker download
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: docker-v0.1.0
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$COMMIT_SHA" --title "English Desk · Docker kurulumu" --notes-file docs/docker-release-notes.md
          fi
          gh release upload "$RELEASE_TAG" english-desk-linux-amd64.tar.gz --clobber
